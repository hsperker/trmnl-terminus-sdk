[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trmnl-terminus"
version = "0.2.1"
description = "Synchronous Python SDK for Terminus Server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hsperker" }]
keywords = ["trmnl", "terminus", "e-ink", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.urls]
Documentation = "https://github.com/hsperker/trmnl-terminus-sdk#readme"
Issues = "https://github.com/hsperker/trmnl-terminus-sdk/issues"
Repository = "https://github.com/hsperker/trmnl-terminus-sdk"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "respx>=0.22,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.gitignore",
  "/.superpowers/**",
  "/docs/superpowers",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trmnl_terminus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trmnl_terminus"]
